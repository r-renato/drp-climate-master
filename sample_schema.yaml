######## ####### ####### ####### #######
##
##   D R P   C L I M A T E   M A S T E R
##
######## ####### ####### ####### #######
drp_climate_master_v2:
  - name: "Climate Master Hub"
    climate:
      - name: "Home Climate Master v2"
        unique_id: "home_climate_master_v2"
        units: "si"
####### ####### ####### ####### #######
#   H O M E  A R E A S
####### ####### ####### ####### #######
        areas:
          - area: "Kitchen"
            indoor: True
            radiant: True
            sensors: 
              temperature: sensor.ambient_kitchen_temperature
              humidity: sensor.ambient_kitchen_humidity
            thermal_collector_valve_switch: switch.thermal_collector_kitchen
            mq: 10.8
          - area: "Living"
            indoor: True
            radiant: True
            sensors: 
              temperature: sensor.ambient_living_temperature
              humidity: sensor.ambient_living_humidity
            thermal_collector_valve_switch: switch.thermal_collector_living
            mq: 9
          - area: "Foyer"
            indoor: True
            radiant: True
            sensors: 
              temperature: sensor.ambient_living_temperature
              humidity: sensor.ambient_living_humidity
            thermal_collector_valve_switch: switch.thermal_collector_walk_in_closet
            mq: 3.6
          - area: "Master Bedroom"
            indoor: True
            radiant: True
            sensors: 
              temperature: sensor.ambient_master_bedroom_temperature
              humidity: sensor.ambient_master_bedroom_humidity
            thermal_collector_valve_switch: switch.thermal_collector_master_bedroom
            mq: 9
          - area: "Guest Bedroom"
            indoor: True
            radiant: True
            sensors: 
              temperature: sensor.ambient_guest_bedroom_temperature
              humidity: sensor.ambient_guest_bedroom_humidity
            thermal_collector_valve_switch: switch.thermal_collector_guest_bedroom
            mq: 8.2
          - area: "Master Bathroom"
            indoor: True
            radiant: True
            sensors: 
              temperature: sensor.ambient_master_bathroom_temperature
              humidity: sensor.ambient_master_bathroom_humidity
            thermal_collector_valve_switch: switch.thermal_collector_master_bathroom
            mq: 4.6
          - area: "Main Bathroom"
            indoor: True
            radiant: True
            sensors: 
              temperature: sensor.ambient_main_bathroom_temperature
              humidity: sensor.ambient_main_bathroom_humidity
            thermal_collector_valve_switch: switch.thermal_collector_main_bathroom
            mq: 4.2
          - area: "Electric cabinet"
            indoor: True
            radiant: False
            sensors: 
              temperature: sensor.ambient_electric_cabinet_temperature
              humidity: sensor.ambient_electric_cabinet_humidity
          - area: "Terrace"
            indoor: False
            radiant: False
            sensors: 
              temperature: sensor.ambient_outdoor_temperature
              humidity: sensor.ambient_outdoor_humidity
        devices:
####### ####### ####### ####### #######
#   D E V I C E  S U P P L Y  U N I T S
####### ####### ####### ####### #######
          supply_units:
            direct_supply_unit: switch.hcs_direct_supply_unit
            adjustable_supply_unit: switch.hcs_motorized_adjustable_supply_unit_devices
            three_point_mixing_valve: number.hcs_three_point_mixing_valve_adjuster
            sensors:
              boiler_temp_system_supply: sensor.hcs_boiler_probe_system_supply
              boiler_temp_system_return: sensor.hcs_boiler_probe_system_return
              adjustable_temp_system_supply: sensor.hcs_motorized_temperature_adjustable_supply_unit_probe_system_supply
              adjustable_temp_system_return: sensor.hcs_motorized_temperature_adjustable_supply_unit_probe_system_return
              direct_temp_system_supply: sensor.hcs_direct_supply_unit_probe_system_supply
              direct_temp_system_return: sensor.hcs_direct_supply_unit_probe_system_return
####### ####### ####### ####### #######
#   D E V I C E  R A D I A N T
####### ####### ####### ####### #######
          radiant:
            fm_power: switch.hcs_climate_pdc
            power: switch.hmi080_power_control
            mode:
              actuator: number.hmi080_device_mode
              heating: 1
              cooling: 5
            heating_t_setpoint:
              actuator: number.hmi080_wot_heat
              value: 45
            heating_dt_setpoint:
              actuator: number.hmi080_delta_t_heat
              value: 2
            cooling_t_setpoint:
              actuator: number.hmi080_wot_cool
              value: 7
            cooling_dt_setpoint:
              actuator: number.hmi080_delta_t_cool              
              value: 7
            sensors:
              pdc_temp_water_in: sensor.hmi080_t_water_in_pe
              pdc_temp_water_out: sensor.hmi080_t_water_out_pe
####### ####### ####### ####### #######
#   D E V I C E  V M C
####### ####### ####### ####### #######              
          vmc:
            power: switch.vmc_device_power_control
            t_setpoint: number.hcs_vmc_set_ambient_temperature_in_celsius
            h_setpoint: number.hcs_vmc_set_ambient_humidity
            t_dew_point_setpoint: number.vmc_protezione_dew_point_valore_t_dew_point
            delta_t_dew_point_setpoint: number.vmc_protezione_dew_point_differenziale
            spare_setpoint: number.hcs_vmc_spare_set
            vent_recirculation: switch.vmc_richiesta_ventilazione_di_ricircolo
            force_heating: switch.vmc_forzatura_riscaldamento
            force_cooling: switch.vmc_forzatura_raffreddamento
            force_free_cooling: switch.vmc_force_free_cooling_entities
            season:
              actuator: input_select.select_vmc_seasons
              winter: 'Winter'
              summer: 'Summer'
              autumn: 'Off'
              spring: 'Off'
            compressor_management:
              actuator: number.vmc_richiesta_attivazione_compressore
              dehumidification_or_cooling: 0
              dehumidification_only: 1
              cooling_only: 2
            cooling_management:
              actuator: number.vmc_gestione_raffreddamento
              compressor_only: 0
              water_only: 1
              first_water_then_compressor: 2
            requests:
              water: binary_sensor.vmc_richiesta_acqua_da_impianto
              dehumidification: binary_sensor.vmc_richiesta_deumidifica
              heating: binary_sensor.vmc_richiesta_riscaldamento
              cooling: binary_sensor.vmc_richiesta_raffreddamento
            sensors:
              t_ambient: sensor.vmc_ambient_temperature
              h_ambient: sensor.vmc_ambient_humidity
              t_water: sensor.vmc_water_temperature
              t_outdoor: sensor.vmc_outdoor_temperature
              power_on_night: sensor.vmc_power_on_night_time
              power_on_today: sensor.vmc_power_on_time_today
            alarms:
              high_pressure: binary_sensor.vmc_allarme_alta_pressione
              dew_point: binary_sensor.vmc_allarme_dew_point
              low_water_temp: binary_sensor.vmc_avvertimento_bassa_temperatura_acqua_per_on_compressore
              high_water_temp: binary_sensor.vmc_avvertimento_alta_temperatura_acqua_per_on_compressore
              alarm: binary_sensor.vmc_presenza_allarme
####### ####### ####### ####### #######
#   O T H E R  
####### ####### ####### ####### #######
        home_windows_state: binary_sensor.home_windows_state
        
        weather:
          forecast_data:
            provider: weather.home_rome
          historical_data:
            provider: pirateweather
            token: !secret pirateweather_historical_api_token
            latitude: !secret gps_geo_home_lt
            longitude: !secret gps_geo_home_ln

        historical_data:
          influxdb:
            organization: !secret influxdb_org
            bucket: !secret influxdb_bucket
            url: !secret influxdb_url
            token: !secret influxdb_token

        scenarios:
          vacation: switch.scene_button_everyone_to_vacation
          nobodysin : switch.scene_button_all_out_of_home
